name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Assert Docker is available for Testcontainers
        run: docker version

      - name: Maven verification, full lifecycle with Testcontainers tests and context boot
        run: mvn -B -ntp clean verify

      - name: Assert the complete test gate
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          print(f"reports={len(reports)} " + " ".join(f"{key}={value}" for key, value in totals.items()))
          expected = {"tests": 216, "failures": 0, "errors": 0, "skipped": 0}
          if totals != expected or len(reports) != 42:
              print(f"Expected reports=42 and totals={expected}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Endpoint census verify gate
        run: java tools/endpoint-census/EndpointCensus.java . tools/endpoint-census/endpoint-census.txt verify

      - name: OpenAPI audit gate
        run: java tools/openapi-audit/OpenApiAudit.java .

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: error
