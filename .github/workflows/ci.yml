name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --no-banner --redact=100

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Assert Docker is available for Testcontainers
        run: docker version

      - name: Maven verification, full lifecycle with Testcontainers tests and context boot
        run: mvn -B -ntp clean verify

      - name: Assert the complete test gate
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          print(f"reports={len(reports)} " + " ".join(f"{key}={value}" for key, value in totals.items()))
          expected = {"tests": 219, "failures": 0, "errors": 0, "skipped": 0}
          if totals != expected or len(reports) != 43:
              print(f"Expected reports=43 and totals={expected}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Endpoint census verify gate
        run: java tools/endpoint-census/EndpointCensus.java . tools/endpoint-census/endpoint-census.txt verify

      - name: Upstream endpoint signature parity gate
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib
          import hashlib
          from pathlib import Path

          current_path = Path("tools/endpoint-census/endpoint-census.txt")
          upstream_path = Path("tools/endpoint-census/upstream-55fbf705-endpoint-census.txt")
          upstream_checksum_path = Path(str(upstream_path) + ".sha256")

          def signatures(path):
              result = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line or line.startswith("#"):
                      continue
                  fields = line.split("|")
                  if len(fields) != 7:
                      raise SystemExit(f"Malformed census row in {path}: {line}")
                  result.append("|".join(fields[:6]))
              return result

          upstream_bytes = upstream_path.read_bytes()
          expected_upstream_hash = upstream_checksum_path.read_text(encoding="utf-8").strip()
          actual_upstream_hash = hashlib.sha256(upstream_bytes).hexdigest()
          if actual_upstream_hash != expected_upstream_hash:
              raise SystemExit(
                  f"Upstream census checksum mismatch: {actual_upstream_hash} != {expected_upstream_hash}"
              )

          current = signatures(current_path)
          upstream = signatures(upstream_path)
          if len(current) != 139 or len(upstream) != 139:
              raise SystemExit(
                  f"Expected 139 signatures in each census, got current={len(current)} upstream={len(upstream)}"
              )
          if current != upstream:
              print("\n".join(difflib.unified_diff(upstream, current, "upstream", "current")))
              raise SystemExit("Endpoint signature parity failed")

          semantic_bytes = ("\n".join(current) + "\n").encode("utf-8")
          print(
              "UPSTREAM PARITY OK: 139 mapping, method, route, controller, and handler "
              f"signatures match; SHA-256 {hashlib.sha256(semantic_bytes).hexdigest()}"
          )
          PY

      - name: OpenAPI audit gate
        run: java tools/openapi-audit/OpenApiAudit.java .

      - name: Upload surefire reports
        if: ${{ always() && hashFiles('**/target/surefire-reports/TEST-*.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: error
