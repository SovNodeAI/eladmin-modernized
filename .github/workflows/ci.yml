name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --no-banner --redact=100

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Assert Docker is available for Testcontainers
        run: docker version

      - name: Maven verification, full lifecycle with Testcontainers tests and context boot
        run: mvn -B -ntp clean verify

      - name: Assert the complete test gate
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          print(f"reports={len(reports)} " + " ".join(f"{key}={value}" for key, value in totals.items()))
          expected = {"tests": 219, "failures": 0, "errors": 0, "skipped": 0}
          if totals != expected or len(reports) != 43:
              print(f"Expected reports=43 and totals={expected}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Endpoint census verify gate
        run: java tools/endpoint-census/EndpointCensus.java . tools/endpoint-census/endpoint-census.txt verify

      - name: OpenAPI audit gate
        run: java tools/openapi-audit/OpenApiAudit.java .

      - name: Upload surefire reports
        if: ${{ always() && hashFiles('**/target/surefire-reports/TEST-*.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: error
